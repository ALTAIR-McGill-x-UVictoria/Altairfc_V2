[mavlink]
port = "/dev/serial/by-id/usb-Auterion_PX4_FMU_v6X.x_0-if00"
baud = 115200

[telemetry]
port = "auto"   # "auto": detect CP210x (LR-900p); explicit: "/dev/ttyUSB0"; "none": disable radio
baud = 57600

[tasks.mavlink]
enabled = true
period_s = 0.02   # 50 Hz

[tasks.telemetry]
enabled = true
period_s = 0.05    # 20 Hz tick — each packet type has its own TX_RATE_HZ set in its class

[tasks.pointing]
enabled = false
period_s = 0.05

[tasks.sphere_pitch]
enabled = false
period_s = 1.0

[tasks.photodiode]
enabled = true
period_s = 0.01   # 100 Hz TIA sample pairs
signal_data_rate = "SPS_800"
temperature_data_rate = "SPS_2000"
temperature_period_s = 1.0
batch_size = 50
batch_tx_rate_hz = 2.0
bias_voltage_v = 0.0   # safe default; set the required flight bias before enabling

[tasks.power]
enabled = true
period_s = 0.1    # 10 Hz
i2c_dev  = "/dev/i2c-1"

[tasks.command_receiver]
enabled  = true
period_s = 0.05   # 20 Hz — drains incoming command frames between telemetry cycles

[tasks.gps]
enabled  = true
period_s = 1.0    # 1 Hz — MAX-M10M default output rate

[tasks.flight_stage]
enabled  = true
period_s = 0.5    # 2 Hz

[tasks.datalogger]
enabled  = true
period_s = 0.05   # 20 Hz tick — each packet logged at its own TX_RATE_HZ

[tasks.radio_config]
enabled  = true
period_s = 0.5    # 2 Hz — command poll rate; actual radio I/O is blocking

[tasks.lighting]
enabled  = true  # PLACEHOLDER — enable once flight-ready
period_s = 0.02   # was 0.2 (5 Hz) — too slow for the sphere current-hold loop below: at 5 Hz the loop can
                   # only apply max_code_step of correction 5x/sec, ~4-6x less closed-loop bandwidth than
                   # tests/test_LED_system.py's free-running loop (which is what was actually validated
                   # stable), so it couldn't reject the RF-coupled gate disturbance fast enough between
                   # updates. period_s this low just makes the task scheduler's deadline loop call execute()
                   # back-to-back (it self-throttles gracefully on overrun, see core/task_base.py), so the
                   # sphere loop ends up I2C-bound same as the test script, not artificially capped at 5 Hz.
                   # Still tight enough for the 5s beacon flash duration below.
i2c_dev  = "/dev/i2c-1"
sphere_target_current_a = 0.4   # A — PI current-hold target (drivers/sphere_led.py hold_current()/update())
                                    # Sphere turns on as soon as the lighting task starts (not gated on
                                    # event.ascent_active) and never turns off internally afterward —
                                    # FlightStageTask stops the "lighting" task entirely at apogee
                                    # (burst/termination), and teardown() zeroes both LED channels.
sphere_kp = 5000.0   # PI current-loop gains — match tests/test_LED_system.py's defaults, the ones actually
sphere_ki = 1000.0    # confirmed stable against the RF disturbance; drivers/sphere_led.py's own defaults
                      # (2000/400) were untested placeholders, not soak-validated
beacon_dac_code = 4095   # PLACEHOLDER — beacon brightness setpoint, MCP4728 channel 1 (0-3000, clamped by
                          # BEACON_MAX_SAFE_CODE); held constant, on/off toggling below drives the channel 3 relay
beacon_flash_hz = 2.0     # strobe rate (50% duty cycle) while inside a beacon_windows entry below —
                           # e.g. 2.0 = on 0.25s / off 0.25s, repeating

# start_utc is UTC (system-clock) time-of-day "HH:MM:SS"; windows may cross UTC midnight.
# period_s makes a window recur (default: one day, i.e. a single daily window).
# Beacon flashes for 5s at :25 and :55 of every minute, whenever the sphere isn't on
# (i.e. before the observation window starts and after this task is stopped at apogee).
[[tasks.lighting.beacon_windows]]
start_utc  = "00:00:25"
duration_s = 5.0
period_s   = 60.0
label      = "beacon_25"

[[tasks.lighting.beacon_windows]]
start_utc  = "00:00:55"
duration_s = 5.0
period_s   = 60.0
label      = "beacon_55"

[datalogger]
log_root = "logs"   # relative to altairfc/; absolute paths also accepted

[flight_stage]
termination_altitude_m        = 25000.0   # fire cutdown above this baro MSL altitude (m)
burst_altitude_m              = 30000.0   # expected natural burst altitude (m)
burst_altitude_uncertainty_m  = 2000.0    # ± window for burst zone detection (m)
ascent_detect_window_s        = 30.0      # rolling window to confirm ascent (s)
ascent_detect_gain_m          = 50.0      # altitude gain over window to confirm ascent (m)
apogee_fraction               = 0.95      # descent declared when alt ≤ this × measured apogee
landing_fraction              = 0.05      # landing declared when alt ≤ this × measured apogee
recovery_stationary_s         = 10.0      # seconds of altitude stationary (±2 m) → recovery
termination_confirm_drop_m    = 100.0     # altitude drop required to confirm cutdown worked (m)
termination_confirm_window_s  = 30.0      # time window for termination confirmation (s)
pointing_activate_altitude_m  = -200.0   # GPS MSL altitude (m) above which motors activate
pointing_duration_min         = 120.0     # how long to run motor control after activation (minutes)
auto_advance                  = true      # automatically advance PREFLIGHT→ARMED without ARM command
preflight_debounce_s          = 5.0       # seconds preflight checks must pass continuously before auto-arming
bypass_launch_altitude_checks = true      # automatically advance ARMED→LAUNCH→ASCENT without altitude gain

[pointing]
spinup_rpm = 2000.0
spinup_s = 2.0
stabilize_yaw_rate = 1.5
unstable_yaw_rate = 1.0
stability_threshold = 4.0
saturation_rpm = 2900.0
saturation_s = 5.0
switch_threshold = 0.2
yaw_rate_deadband = 0.05

[flight_stage.require]
mavlink   = true    # MAVLink attitude data must be fresh (was a bad USB cable, not a code issue — fixed)
rw_vesc   = false   # PLACEHOLDER — was true; no reaction-wheel VESC connected on this bench rig, so
                     # preflight could never pass and STAGE_ASCENT (and the sphere LED loop) never
                     # engaged. Re-enable before flight.
mm_vesc   = false   # momentum management VESC must be reporting
gps       = true   # GPS must have a valid fix before arming

[system]
log_level = "INFO"
monitor_interval_s = 5.0
watchdog_sec = 30.0   # systemd WatchdogSec — must match flight.service

[profiling]
# Optional scheduler-task CPU profiler for test runs. When enabled, flight.log
# shows CPU used by each AltairFC task plus unattributed helper-thread CPU.
enabled = false
interval_s = 5.0
top_n = 5
minimum_cpu_pct = 1.0

[ground_station]
use_hardcoded = false   # true: always use lat/lon/alt below; false: use GS GPS command if received
latitude = 45.49446
longitude = -73.55218
altitude = 55.0

[rw_esc]
port = "/dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.4:1.0"
baud = 115200

[mm_esc]
port = "/dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.3:1.0"
baud = 115200


[radio_config]
# LR900P modem initial configuration applied on startup if it differs from
# the modem's current settings.  Changing these values here takes effect on
# the next FC boot; a RADIO_CONFIG ground command can change them at runtime.
config_enabled = false  # true: read/write modem config on startup and handle GS commands
                        # false: transparent passthrough only — no config frames sent
data_rate  = 0    # 0=Low, 1=Mid, 2=High
tx_power   = 2    # 0=Low, 1=Mid, 2=High
channel    = 0    # 0-63
watchdog_s = 30.0 # seconds without GS contact on new channel before rolling back to defaults
# Telemetry TX rate scale per data_rate index [Low, Mid, High].
# Effective rate = TX_RATE_HZ * scale. Keeps the TX queue from overflowing at lower data rates.
rate_scale = [0.1, 0.33, 1.0]

[controller.reaction_wheel.pointing]
Kp = 8000.0
Kd = 624.0
Ki = 0.0
max_rpm = 1500.0
min_rpm = -1500.0

[controller.reaction_wheel.stabilize]
Kp = 624.0
Kd = 0.0
Ki = 0.0
max_rpm = 1500.0
min_rpm = -1500.0



